version: '3.8'

services:
  jenkins:
    build: 
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: jenkins-devops
    user: root # Run as root to access the mounted docker.sock from Windows
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      # Mount Windows Docker socket into the Jenkins container (Docker-out-of-Docker)
      - //var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:

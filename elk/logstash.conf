input {
  # Listen for incoming log data on port 5000
  tcp {
    port => 5000
    codec => json
  }
}

filter {
  # Basic parsing can be added here
}

output {
  # Forward logs to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "chatbot-logs-%{+YYYY.MM.dd}"
  }
  # Also print them to the console for debugging
  stdout { codec => rubydebug }
}
